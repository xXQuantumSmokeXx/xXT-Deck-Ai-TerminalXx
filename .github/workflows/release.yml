name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG exists; nothing to repair."
              exit 0
            fi
            echo "Repairing missing release for $TAG"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.resolve.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Build firmware
        if: steps.resolve.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade platformio
          pio run

      - name: Publish release
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          [ -n "$TITLE" ] || TITLE="$TAG"
          git tag -l --format='%(contents:body)' "$TAG" > release-notes.md
          cp .pio/build/T-Deck/firmware.bin "T-Deck-Ai-Terminal-${TAG}.bin"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "T-Deck-Ai-Terminal-${TAG}.bin" --clobber
            if [ -s release-notes.md ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            fi
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" "T-Deck-Ai-Terminal-${TAG}.bin" \
              --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" "T-Deck-Ai-Terminal-${TAG}.bin" \
              --title "$TITLE" --generate-notes
          fi
